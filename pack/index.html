<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Midnight Eclipse</title>
  <!-- Open the CDN connections while the page is still parsing. -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <link rel="stylesheet" type="text/css" href="./styles.css" />
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
    integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo=" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    // Midnight Eclipse — Zebar status bar for komorebi.
    //
    // Start: workspace buttons, a layout drawer, and an app list that
    // mirrors the native taskbar (helpers/taskbar-mirror). Middle: date
    // and the focused window's title. End: media player, tray drawer,
    // network / memory / CPU / battery / volume / weather readings, and
    // Quick Settings shortcuts. Tooltips are drawn by the separate
    // tooltip widget (tooltip.html).
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    // Pinned to the installed Zebar app's version. The v2 client lacked
    // audio.setMute and the systray provider entirely.
    import * as zebar from 'https://esm.sh/zebar@3.3.1';
    // Same @tauri-apps/api version zebar@3.3.1 bundles, so both share one copy.
    import { emit } from 'https://esm.sh/@tauri-apps/api@2.0.2/event';
    import { invoke } from 'https://esm.sh/@tauri-apps/api@2.0.2/core';

    // zebar@3.3.1 bug: ShellProcess.write() and .kill() invoke the desktop
    // commands with `{ processId }`, but shell_write/shell_kill take `pid`, so
    // Tauri rejects every call (asynchronously, so it's easy to miss). Call
    // the commands directly with the argument name they expect.
    const shellWrite = (proc, data) => invoke('shell_write', { pid: proc.processId, buffer: data });
    const shellKill = proc => invoke('shell_kill', { pid: proc.processId });

    // Zebar data sources, alphabetical. Battery is only a fallback and
    // tooltip detail source (see below); live power comes from power-status.
    const providers = zebar.createProviderGroup({
      audio: { type: 'audio' },
      battery: { type: 'battery' },
      cpu: { type: 'cpu' },
      date: { type: 'date', formatting: 'EEE, MMM d, yyyy, h:mm a' },
      komorebi: { type: 'komorebi' },
      media: { type: 'media' },
      memory: { type: 'memory' },
      network: { type: 'network' },
      systray: { type: 'systray' },
      weather: { type: 'weather' },
    });

    // Battery. The icon, charge % and plugged-in state come from the
    // power-status helper (usePowerStatus), which sees the charger change
    // within 500ms. Zebar's battery provider only refreshes every 60s by
    // default, so plug/unplug used to take a minute or more to show; it's
    // kept only for the tooltip's details (health), and as a fallback if the
    // helper isn't running.
    //
    // It also needs recovering. Its library (starship-battery 0.8.3) looks up
    // the battery's Windows "tag" once, at startup, and reuses it on every
    // refresh. Windows can issue a new tag when the battery's state changes,
    // after which every refresh fails and the provider never recovers on its
    // own. Seen here: started while charging, then unplugged -> the stat
    // vanished; restarting the provider (which fetches a fresh tag) brought
    // it back while still on battery. So it's restarted on error, and right
    // away whenever the charger is plugged or unplugged. Meanwhile its last
    // good reading is kept (up to 30s).
    let lastBattery = null;
    let batteryHoldUntil = 0;
    let batteryRestartPending = false;
    let lastBatteryRestart = 0;
    function restartBattery() {
      lastBatteryRestart = Date.now();
      providers.raw.battery.restart().catch(err => console.error('battery restart failed', err));
    }
    providers.raw.battery.onOutput(output => {
      lastBattery = output;
      batteryHoldUntil = 0;
    });
    providers.raw.battery.onError(() => {
      if (!batteryHoldUntil) batteryHoldUntil = Date.now() + 30000;
      if (batteryRestartPending) return;
      batteryRestartPending = true;
      // At most one error-driven restart per 10s, so a battery that's really
      // gone (errors on every start) is retried gently rather than in a loop.
      setTimeout(() => {
        batteryRestartPending = false;
        restartBattery();
      }, Math.max(2000, lastBatteryRestart + 10000 - Date.now()));
    });
    const currentBattery = output => output ?? (Date.now() < batteryHoldUntil ? lastBattery : null);

    createRoot(document.getElementById('root')).render(<App />);

    // komorebi's provider is a passive state listener with no command API,
    // so clicks shell out to komorebic via shellExec.
    // Absolute path, not bare name: Zebar resolves programs through the
    // PATH it inherited from its launcher, and it's launched by Explorer,
    // whose PATH can predate the komorebi install. Each program string
    // here must match a zpack.json privileges entry character-for-character
    // (Zebar compares them with ==).
    const KOMOREBIC = '__KOMOREBIC__';

    // Failures otherwise land only in the widget's devtools console,
    // which is invisible in normal use — surface them in the bar instead.
    const errorListeners = new Set();
    function reportError(message) {
      console.error(message);
      errorListeners.forEach(fn => fn(message));
    }

    async function run(program, args = []) {
      try {
        const result = await zebar.shellExec(program, args);
        if (result.code !== 0) {
          reportError(`${program} ${args.join(' ')} exited ${result.code}: ${result.stderr || result.stdout}`);
        }
      } catch (err) {
        reportError(`${program} ${args.join(' ')} failed: ${err}`);
      }
    }

    const runKomorebic = (...args) => run(KOMOREBIC, args);

    // komorebi subscription watchdog. Zebar's komorebi client (komorebi-util
    // 3.3.1) handles one notification connection at a time, reading each to
    // EOF with no timeout; if one never finishes, its listener stops
    // accepting and the bar freezes on its last state (seen: komorebi on
    // workspace 2, bar still showing workspace 1) without any error. Every
    // 5s, ask komorebi which workspace is focused; after two mismatches in a
    // row, restart the provider. komorebi sends the full state to a new
    // subscriber straight away, so the bar resyncs at once.
    const WATCHDOG_MS = 5000;
    let watchdogMisses = 0;
    let watchdogWarned = false;
    async function checkKomorebiSubscription() {
      const shown = providers.outputMap.komorebi?.focusedMonitor?.focusedWorkspaceIndex;
      if (shown == null) return; // no komorebi data to compare (not running, or provider erroring)
      let actual;
      try {
        const result = await zebar.shellExec(KOMOREBIC, ['query', 'focused-workspace-index']);
        if (result.code !== 0) return; // komorebi busy or restarting: try again next time
        actual = parseInt(result.stdout.trim(), 10);
      } catch (err) {
        if (!watchdogWarned) { watchdogWarned = true; reportError(`komorebi watchdog can't query komorebi: ${err}`); }
        return;
      }
      if (Number.isNaN(actual) || actual === shown) { watchdogMisses = 0; return; }
      if (++watchdogMisses < 2) return; // allow for a switch that's still arriving
      watchdogMisses = 0;
      console.warn(`komorebi subscription stale (bar shows workspace ${shown}, komorebi ${actual}); resubscribing`);
      providers.raw.komorebi.restart().catch(err => reportError(`komorebi resubscribe failed: ${err}`));
    }
    setInterval(checkKomorebiSubscription, WATCHDOG_MS);

    // Opening apps/Settings pages goes through explorer.exe so Windows
    // handles ms-actioncenter: URIs and self-elevating apps (Task Manager).
    // Spawned, not exec'd: explorer.exe exits with code 1 even on
    // success, which run() would misreport as a failure.
    function openShell(target = '') {
      zebar.shellSpawn('explorer.exe', target ? [target] : []).catch(err =>
        reportError(`explorer.exe ${target} failed: ${err}`),
      );
    }

    const formatGb = bytes => `${(bytes / 1024 ** 3).toFixed(1)} GB`;

    // Wraps a provider method call (setVolume, togglePlayPause, tray
    // clicks) so a rejected promise surfaces in the bar like shell errors.
    function call(label, fn) {
      try {
        Promise.resolve(fn()).catch(err => reportError(`${label} failed: ${err}`));
      } catch (err) {
        reportError(`${label} failed: ${err}`);
      }
    }

    // Styled tooltips, rendered by the separate `tooltip` widget
    // (tooltip.html): native `title` tooltips can't be styled, and this
    // 44px window clips anything drawn below it. `tip(content)` returns the
    // hover props for an element; content is a string or
    // { title, rows: [[label, value], ...], hint, tone: 'error' }.
    const TIP_EVENT = 'midnight-eclipse:tooltip';
    const TIP_DELAY = 350;
    let tipTimer = null;
    let tipTarget = null;
    let tipVisible = false;
    let tipHiddenAt = 0;

    async function showTip(target, content) {
      try {
        const win = zebar.currentWidget().tauriWindow;
        const [pos, size, scale] = await Promise.all([win.outerPosition(), win.outerSize(), win.scaleFactor()]);
        if (tipTarget !== target) return; // pointer already left
        const r = target.getBoundingClientRect();
        const barX = pos.x / scale;
        tipVisible = true;
        await emit(TIP_EVENT, {
          show: true,
          tip: content,
          anchor: { x: barX + r.left, width: r.width, barBottom: pos.y / scale + size.height / scale },
          bounds: { left: barX, right: barX + size.width / scale },
        });
      } catch (err) {
        console.error('tooltip failed', err);
      }
    }

    function hideTip() {
      clearTimeout(tipTimer);
      tipTarget = null;
      if (!tipVisible) return;
      tipVisible = false;
      tipHiddenAt = Date.now();
      emit(TIP_EVENT, { show: false }).catch(() => {});
    }

    function tip(content) {
      if (!content) return {};
      const normalized = typeof content === 'string' ? { title: content } : content;
      return {
        'aria-label': normalized.title,
        onMouseEnter: e => {
          const target = e.currentTarget;
          clearTimeout(tipTimer);
          tipTarget = target;
          // Moving between items while a tooltip is up switches instantly.
          const quick = tipVisible || Date.now() - tipHiddenAt < 400;
          tipTimer = setTimeout(() => showTip(target, normalized), quick ? 0 : TIP_DELAY);
        },
        onMouseLeave: hideTip,
        onMouseDown: hideTip,
      };
    }

    // Tray hover forwarding is best-effort: many icons reject hover events
    // ("Unable to send event to icon"), and hover fires continuously, so
    // reporting these would keep the error indicator permanently lit.
    function quiet(fn) {
      try {
        Promise.resolve(fn()).catch(() => {});
      } catch {}
    }

    // komorebi's KomorebiWorkspace has no hasFocus/isDisplayed booleans —
    // derive them by comparing against the
    // top-level focusedWorkspace/displayedWorkspace references.
    function isWorkspaceFocused(komorebi, workspace) {
      return komorebi.focusedWorkspace?.name === workspace.name;
    }
    function isWorkspaceDisplayed(komorebi, workspace) {
      return komorebi.displayedWorkspace?.name === workspace.name;
    }

    // komorebi has no top-level "active window" field. Derive it from
    // the focused workspace: prefer monocleContainer if monocle mode
    // is active, otherwise the container at focusedContainerIndex.
    function getFocusedWindow(workspace) {
      if (!workspace) return null;
      const container =
        workspace.monocleContainer ??
        workspace.tilingContainers?.[workspace.focusedContainerIndex];
      return container?.windows?.[0] ?? null;
    }

    // `id` is what `komorebic change-layout` accepts. `zebar` is how
    // Zebar's komorebi provider reports it: its parser only knows seven
    // layouts by name, and anything else (Columns, Scrolling) arrives as
    // 'custom' via a serde(other) fallback, so those two are
    // indistinguishable without remembering what the bar set.
    const LAYOUTS = [
      { id: 'bsp', label: 'BSP', icon: 'nf-md-view_quilt', zebar: 'bsp' },
      { id: 'vertical-stack', label: 'Vertical Stack', icon: 'nf-md-view_split_vertical', mirror: true, zebar: 'vertical_stack' },
      { id: 'right-main-vertical-stack', label: 'Right Main Vertical Stack', icon: 'nf-md-view_split_vertical', zebar: 'right_main_vertical_stack' },
      { id: 'horizontal-stack', label: 'Horizontal Stack', icon: 'nf-md-view_compact', zebar: 'horizontal_stack' },
      { id: 'columns', label: 'Columns', icon: 'nf-md-view_column', zebar: 'custom' },
      { id: 'rows', label: 'Rows', icon: 'nf-md-view_agenda', zebar: 'rows' },
      { id: 'grid', label: 'Grid', icon: 'nf-md-view_grid', zebar: 'grid' },
      { id: 'ultrawide-vertical-stack', label: 'Ultrawide Vertical Stack', icon: 'nf-md-view_array', zebar: 'ultrawide_vertical_stack' },
      { id: 'scrolling', label: 'Scrolling', icon: 'nf-md-view_carousel', zebar: 'custom' },
    ];

    // Per-workspace memory of the last layout the bar set, used only to
    // tell Columns from Scrolling when Zebar reports 'custom'.
    const LAYOUT_MEMORY_KEY = 'midnight-eclipse-layout-memory';
    function loadLayoutMemory() {
      try { return JSON.parse(localStorage.getItem(LAYOUT_MEMORY_KEY) ?? '{}'); } catch { return {}; }
    }

    // The window list mirrors the native taskbar (helpers/taskbar-mirror):
    // same buttons, same order, same icons. So Windows' own Win+1..9 lines up
    // with the icons, and clicking icon N sends Win+N, making Windows do
    // exactly what the taskbar would (activate / minimize / cycle a group).
    const TASKBAR_MIRROR = '__HELPERS__\\taskbar-mirror.exe';

    // The taskbar shows only the displayed workspace's windows: komorebi
    // cloaks the others, but the taskbar would still list them. These are the
    // windows on every workspace that isn't the one shown on its monitor;
    // taskbar-mirror takes them off the taskbar (and puts back any that
    // leave the list). Minimized windows aren't on any komorebi workspace, so
    // they always stay on the taskbar, as usual.
    function hiddenWorkspaceHwnds(komorebi) {
      const hwnds = new Set();
      for (const monitor of komorebi?.allMonitors ?? []) {
        (monitor.workspaces ?? []).forEach((workspace, i) => {
          if (i === monitor.focusedWorkspaceIndex) return;
          const windows = [
            ...(workspace.tilingContainers ?? []).flatMap(c => c.windows ?? []),
            ...(workspace.monocleContainer?.windows ?? []),
            ...(workspace.floatingWindows ?? []),
            workspace.maximizedWindow,
          ];
          for (const w of windows) if (w?.hwnd) hwnds.add(w.hwnd);
        });
      }
      return [...hwnds].sort((a, b) => a - b);
    }

    // Keeps `taskbar-mirror watch` running for the bar's lifetime; it prints a
    // JSON line whenever the taskbar changes. Restarts it if it dies.
    // `hideLine` ("hide <hwnd>,...") is written to its stdin whenever it
    // changes, and again to each new instance.
    function useTaskbar(hideLine) {
      const [buttons, setButtons] = useState([]);
      const hideRef = useRef(hideLine);
      hideRef.current = hideLine;
      const send = (proc, line) =>
        shellWrite(proc, line + '\n').catch(err => reportError(`taskbar mirror: couldn't send window list: ${err}`));
      // A killed helper can't put hidden windows back itself; the next
      // instance does, from the state file it keeps.
      const procRef = useWatcher(TASKBAR_MIRROR, 'taskbar mirror', data => setButtons(data), proc => send(proc, hideRef.current));
      useEffect(() => { if (procRef.current) send(procRef.current, hideLine); }, [hideLine]);
      return buttons;
    }

    // Live power state from Windows (helpers/power-status):
    // { hasBattery, acOnline, charging, percent, energySaver }, or null until
    // the helper's first report. Zebar's battery provider is too slow for
    // plug/unplug and doesn't report energy saver at all.
    const POWER_STATUS = '__HELPERS__\\power-status.exe';
    function usePowerStatus() {
      const [power, setPower] = useState(null);
      useWatcher(POWER_STATUS, 'power status', data => setPower(data));
      return power;
    }

    // Keeps a helper's `watch` mode running for the bar's lifetime, parsing
    // each stdout line as JSON and passing the latest to onData. Restarts the
    // helper if it exits. Returns a ref to the live process, for writing to
    // its stdin. onData/onStart are captured once, so they must only use
    // state setters and refs.
    function useWatcher(program, label, onData, onStart) {
      const procRef = useRef(null);
      useEffect(() => {
        let proc = null;
        let stopped = false;
        let buffer = '';
        let retry;
        async function start() {
          try {
            proc = await zebar.shellSpawn(program, ['watch']);
            procRef.current = proc;
            onStart?.(proc);
            proc.onStdout(chunk => {
              buffer += chunk;
              const lines = buffer.split(/\r?\n/);
              buffer = lines.pop();
              const latest = lines.filter(Boolean).pop();
              if (latest) {
                try { onData(JSON.parse(latest)); } catch (err) { reportError(`${label} sent bad data: ${err}`); }
              }
            });
            proc.onExit(status => {
              if (procRef.current === proc) procRef.current = null;
              if (stopped) return;
              reportError(`${label} exited (code ${status.exitCode}); restarting`);
              retry = setTimeout(start, 3000);
            });
          } catch (err) {
            reportError(`${label} failed to start: ${err}`);
            retry = setTimeout(start, 5000);
          }
        }
        start();
        return () => { stopped = true; clearTimeout(retry); procRef.current = null; if (proc) shellKill(proc).catch(() => {}); };
      }, []);
      return procRef;
    }

    const LAYOUTS_OPEN_KEY = 'midnight-eclipse-layouts-open';
    function loadLayoutsOpen() {
      try { return localStorage.getItem(LAYOUTS_OPEN_KEY) === 'true'; } catch { return false; }
    }

    function resolveLayout(workspace, memory) {
      if (!workspace) return null;
      if (workspace.layout !== 'custom') return LAYOUTS.find(l => l.zebar === workspace.layout) ?? null;
      const remembered = LAYOUTS.find(l => l.id === memory[workspace.name]);
      return remembered?.zebar === 'custom' ? remembered : null;
    }

    // Windows 11 Quick Settings panels. Each target was verified on this
    // machine (25H2, build 26200) by opening it through explorer.exe and
    // screenshotting the result. These links are undocumented: unknown
    // page names silently fall back to the main page (that fallback is
    // what `controlcenter/` relies on), and `controlcenter` without the
    // slash opens Notifications instead. `&showFooter=true`, often cited
    // online, opened nothing via explorer.exe.
    const QS = {
      main: 'ms-actioncenter:controlcenter/',
      wifi: 'ms-actioncenter:controlcenter/wifi',
      bluetooth: 'ms-actioncenter:controlcenter/bluetooth',
      cast: 'ms-actioncenter:controlcenter/cast',
      project: 'ms-actioncenter:controlcenter/project',
      volume: 'ms-actioncenter:controlcenter/volume',
      notifications: 'ms-actioncenter:',
    };

    // Windows' own speaker and battery tray icons duplicate the bar's volume
    // and battery stats. Zebar identifies a tray icon by its Windows GUID
    // when it has one (else "hwnd:uid"), and Windows' system icons use the
    // fixed 7820AE7x-23E3-4229-82C1-E41CB67D5B9C family.
    //   ...73 = volume (documented); ...75 = power/battery (inferred from
    //   the gap between network ...74 and action center ...76).
    // Matching on the tooltip was tried first and never matched: these
    // system icons don't appear to pass their tooltip text through.
    const HIDDEN_TRAY_IDS = new Set([
      '7820ae73-23e3-4229-82c1-e41cb67d5b9c', // volume
      '7820ae75-23e3-4229-82c1-e41cb67d5b9c', // power / battery
    ]);
    const normalizeId = id => String(id ?? '').replace(/[{}]/g, '').toLowerCase();
    const isHiddenTrayIcon = icon => HIDDEN_TRAY_IDS.has(normalizeId(icon.id));

    const TRAY_OPEN_KEY = 'midnight-eclipse-tray-open';
    function loadTrayOpen() {
      try { return localStorage.getItem(TRAY_OPEN_KEY) === 'true'; } catch { return false; }
    }

    // ---------------------------------------------------------------- glyphs
    // Nerd Font glyph names for each reading. Levels count how many
    // thresholds a value passes, so each table reads low to high.

    const Glyph = ({ name, className }) => <i className={className ? `nf ${name} ${className}` : `nf ${name}`}></i>;
    const passed = (value, thresholds, strict) => thresholds.filter(t => (strict ? value > t : value >= t)).length;

    // Wi-Fi signal strength (%) at which each bar appears.
    const WIFI_STEPS = [25, 40, 65, 80];
    function networkGlyph(net) {
      const kind = net.defaultInterface?.type;
      if (kind === 'ethernet') return 'nf-md-ethernet_cable';
      if (kind !== 'wifi') return 'nf-md-wifi_strength_off_outline';
      const bars = passed(net.defaultGateway?.signalStrength ?? 0, WIFI_STEPS);
      return bars ? `nf-md-wifi_strength_${bars}` : 'nf-md-wifi_strength_outline';
    }

    // Charge (%) above which each battery segment fills (nf-fa-battery_0..4).
    const BATTERY_STEPS = [20, 40, 70, 90];
    const batteryGlyph = percent => `nf-fa-battery_${passed(percent, BATTERY_STEPS, true)}`;

    // Battery tint, most urgent first: red at 10% or below (even while
    // plugged in or in energy saver), yellow in energy saver, green while
    // plugged in above 30%; otherwise none (the normal accent).
    function batteryTone(percent, pluggedIn, energySaver) {
      if (percent <= 10) return 'danger';
      if (energySaver) return 'warning';
      if (pluggedIn && percent > 30) return 'success';
      return undefined;
    }

    // Volume (%) above which the next louder speaker glyph is used.
    const VOLUME_GLYPHS = ['nf-fa-volume_down', 'nf-md-volume_medium', 'nf-fa-volume_up'];
    const VOLUME_STEPS = [33, 66];
    function volumeGlyph(device) {
      const volume = Math.round(device.volume ?? 0);
      if (device.isMuted || volume === 0) return 'nf-fa-volume_off';
      return VOLUME_GLYPHS[passed(volume, VOLUME_STEPS, true)];
    }

    // Zebar weather status -> glyph in the Nerd Font weather set.
    const WEATHER_GLYPHS = {
      clear_day: 'day_sunny', clear_night: 'night_clear',
      cloudy_day: 'day_cloudy', cloudy_night: 'night_alt_cloudy',
      light_rain_day: 'day_sprinkle', light_rain_night: 'night_alt_sprinkle',
      heavy_rain_day: 'day_rain', heavy_rain_night: 'night_alt_rain',
      snow_day: 'day_snow', snow_night: 'night_alt_snow',
      thunder_day: 'day_lightning', thunder_night: 'night_alt_lightning',
    };
    const weatherGlyph = status => WEATHER_GLYPHS[status] && `nf-weather-${WEATHER_GLYPHS[status]}`;

    // CPU/memory usage (%) above which the value is highlighted.
    const BUSY_PERCENT = 85;

    function App() {
      // Latest data from every provider, refreshed on each emission.
      const [output, setOutput] = useState(() => providers.outputMap);
      const [lastError, setLastError] = useState(null);
      const [trayOpen, setTrayOpen] = useState(loadTrayOpen);
      const [layoutMemory, setLayoutMemory] = useState(loadLayoutMemory);
      const [layoutsOpen, setLayoutsOpen] = useState(loadLayoutsOpen);
      const hideLine = 'hide ' + hiddenWorkspaceHwnds(output.komorebi).join(',');
      const taskbar = useTaskbar(hideLine);
      const power = usePowerStatus();
      const energySaver = power?.energySaver === true;

      // Charger plugged or unplugged: the battery provider's tag is likely
      // stale now, so restart it at once rather than waiting for its next
      // (60s) refresh to fail.
      const acOnline = power?.acOnline;
      const seenAc = useRef(undefined);
      useEffect(() => {
        if (acOnline === undefined) return;
        if (seenAc.current !== undefined && seenAc.current !== acOnline) restartBattery();
        seenAc.current = acOnline;
      }, [acOnline]);
      const windowsRef = useRef(null);
      const activeAppId = taskbar.find(b => b.active)?.appId;

      // Keep the active app's icon visible when the list is scrolled
      // (capped at 4 while the layout drawer is open, or overflowing).
      useEffect(() => {
        windowsRef.current?.querySelector('.app-btn.is-front')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
      }, [activeAppId, layoutsOpen, taskbar.length]);

      // Mice have no horizontal wheel: map vertical wheel movement to
      // sideways scrolling when a list (windows, tray icons) overflows.
      function scrollSideways(e) {
        const el = e.currentTarget;
        if (el.scrollWidth > el.clientWidth && e.deltaY !== 0) el.scrollLeft += e.deltaY;
      }

      function toggleLayouts() {
        setLayoutsOpen(prev => {
          const next = !prev;
          try { localStorage.setItem(LAYOUTS_OPEN_KEY, String(next)); } catch {}
          return next;
        });
      }

      function chooseLayout(workspaceName, layout) {
        runKomorebic('change-layout', layout.id);
        setLayoutMemory(prev => {
          const next = { ...prev, [workspaceName]: layout.id };
          try { localStorage.setItem(LAYOUT_MEMORY_KEY, JSON.stringify(next)); } catch {}
          return next;
        });
      }

      function toggleTray() {
        setTrayOpen(prev => {
          const next = !prev;
          try { localStorage.setItem(TRAY_OPEN_KEY, String(next)); } catch {}
          return next;
        });
      }

      useEffect(() => {
        let timer;
        const onError = message => {
          setLastError(message);
          clearTimeout(timer);
          timer = setTimeout(() => setLastError(null), 10000);
        };
        errorListeners.add(onError);
        return () => {
          errorListeners.delete(onError);
          clearTimeout(timer);
        };
      }, []);

      // A provider that fails (komorebi stopping, say) gets its output set to
      // null, but Zebar signals that only to error listeners; without the
      // second listener the bar would keep showing the last good state, and
      // keep hiding the last hidden workspace's windows from the taskbar.
      useEffect(() => {
        const sync = () => setOutput(providers.outputMap);
        providers.onOutput(sync);
        providers.onError(sync);
      }, []);

      const komorebi = output.komorebi;
      const focusedWindow = komorebi ? getFocusedWindow(komorebi.focusedWorkspace) : null;

      const audio = output.audio;
      const playback = audio?.defaultPlaybackDevice;
      function changeVolume(delta) {
        if (!playback) return;
        const next = Math.max(0, Math.min(100, Math.round(playback.volume + delta)));
        call('set volume', () => audio.setVolume(next, { deviceId: playback.deviceId }));
      }

      const media = output.media;
      const session = media?.currentSession ?? media?.session ?? null;
      const mediaLabel = session ? [session.artist, session.title].filter(Boolean).join(' – ') : '';

      const net = output.network;
      const netTip = net && {
        title: net.defaultInterface?.friendlyName ?? 'No connection',
        rows: [
          net.defaultGateway?.ssid && ['SSID', net.defaultGateway.ssid],
          net.defaultGateway?.signalStrength != null && ['Signal', `${net.defaultGateway.signalStrength}%`],
          net.defaultInterface?.ipv4Addresses?.[0] && ['IP', net.defaultInterface.ipv4Addresses[0].replace(/\/\d+$/, '')],
          net.traffic && ['Session', `↓ ${net.traffic.totalReceived.siValue.toFixed(1)} ${net.traffic.totalReceived.siUnit}   ↑ ${net.traffic.totalTransmitted.siValue.toFixed(1)} ${net.traffic.totalTransmitted.siUnit}`],
        ].filter(Boolean),
        hint: 'Click: Wi-Fi panel',
      };

      const mem = output.memory;
      const cpu = output.cpu;
      // What the battery stat shows. From the power-status helper when it's
      // reporting (instant plug/unplug), with health from Zebar's provider;
      // otherwise Zebar's provider alone. isCharging = plugged in, so the bolt
      // appears the moment the charger connects, as on Windows' own taskbar
      // icon (which also shows it when plugged in at 100%, not charging).
      const batteryDetails = currentBattery(output.battery);
      const battery = power
        ? (power.hasBattery && power.percent != null
            ? {
                chargePercent: power.percent,
                isCharging: power.acOnline,
                state: power.charging ? 'charging' : power.acOnline ? 'plugged in, not charging' : 'on battery',
                healthPercent: batteryDetails?.healthPercent,
              }
            : null)
        : batteryDetails && { ...batteryDetails, state: batteryDetails.isCharging ? 'charging' : batteryDetails.state };
      const weather = output.weather;
      const trayIcons = (output.systray?.icons ?? []).filter(icon => !isHiddenTrayIcon(icon));

      const workspace = komorebi?.focusedWorkspace;
      const currentLayout = resolveLayout(workspace, layoutMemory);
      // inline-block because CSS transforms don't apply to inline elements,
      // which <i> is by default; `mirror` flips a glyph to show the opposite
      // side (right-main vs left-main stacks).
      const LayoutGlyph = ({ layout }) => (
        <i
          className={`nf ${layout.icon}`}
          style={{ display: 'inline-block', transform: layout.mirror ? 'scaleX(-1)' : undefined }}
        ></i>
      );

      return (
        <div className="bar">
          <div className="zone">
            <Glyph name="nf-fa-windows" className="brand" />

            {komorebi && (
              <div className="ws-list">
                {komorebi.currentWorkspaces.map((ws, i) => (
                  <button
                    key={ws.name ?? i}
                    className={['ws', isWorkspaceFocused(komorebi, ws) && 'is-active', isWorkspaceDisplayed(komorebi, ws) && 'is-visible'].filter(Boolean).join(' ')}
                    onClick={() => runKomorebic('focus-workspace', String(i))}
                  >
                    {ws.name ?? i + 1}
                  </button>
                ))}
              </div>
            )}

            {/* Layout drawer. Collapsed: the current layout + an expand
                chevron. Open: all nine, current first and highlighted. When
                the current layout can't be told apart (Columns/Scrolling set
                outside the bar), a neutral glyph stands in for it. */}
            {workspace && (
              <div className="layout-drawer divider-before">
                {!layoutsOpen && (
                  <button
                    className="layout-opt is-current"
                    {...tip(currentLayout
                      ? { title: currentLayout.label, hint: 'Current layout · click for all' }
                      : { title: 'Columns or Scrolling', hint: 'Set outside the bar, so which one is unknown · click for all' })}
                    onClick={toggleLayouts}
                  >
                    {currentLayout ? <LayoutGlyph layout={currentLayout} /> : <Glyph name="nf-md-dots_horizontal" />}
                  </button>
                )}
                {layoutsOpen && (currentLayout ? [currentLayout, ...LAYOUTS.filter(l => l !== currentLayout)] : LAYOUTS).map(layout => (
                  <button
                    key={layout.id}
                    className={layout === currentLayout ? 'layout-opt is-current' : 'layout-opt'}
                    {...tip(layout === currentLayout ? { title: layout.label, hint: 'Current layout' } : layout.label)}
                    onClick={() => chooseLayout(workspace.name, layout)}
                  >
                    <LayoutGlyph layout={layout} />
                  </button>
                ))}
                <button className="icon-btn" {...tip(layoutsOpen ? 'Hide layouts' : 'Show all layouts')} onClick={toggleLayouts}>
                  <Glyph name={layoutsOpen ? 'nf-md-chevron_left' : 'nf-md-chevron_right'} />
                </button>
              </div>
            )}

            {taskbar.length > 0 && (
              <div className={layoutsOpen ? 'app-list divider-before is-capped' : 'app-list divider-before'} ref={windowsRef} onWheel={scrollSideways}>
                {taskbar.map((app, i) => {
                  // Win+1..9, then Win+0 for the 10th; beyond that there's
                  // no shortcut, so the icon is display-only.
                  const key = i < 9 ? String(i + 1) : i === 9 ? '0' : null;
                  const running = app.windows > 0;
                  return (
                    <button
                      key={app.appId}
                      className={['app-btn', app.active && 'is-front', !running && 'is-pinned'].filter(Boolean).join(' ')}
                      {...tip({ title: app.name, rows: [['Windows', running ? String(app.windows) : 'pinned, not running']], hint: key ? `Click or Win+${key}` : 'No shortcut beyond the 10th icon' })}
                      disabled={!key}
                      onClick={() => key && run(TASKBAR_MIRROR, ['press', key])}
                    >
                      {app.icon ? <img className="app-icon" src={app.icon} alt="" /> : <Glyph name="nf-md-application" />}
                      {app.windows > 1 && <span className="app-count">{app.windows}</span>}
                    </button>
                  );
                })}
              </div>
            )}
          </div>

          <div className="panel clock">
            {lastError && (
              <span className="error-flag" {...tip({ title: 'Command failed', rows: [['Error', lastError]], tone: 'error' })}>
                <Glyph name="nf-fa-warning" />
              </span>
            )}
            <span className="clock-date" {...tip({ title: 'Notifications & calendar', hint: 'Click to open' })} onClick={() => openShell(QS.notifications)}>
              {output.date?.formatted}
            </span>
            {focusedWindow?.exe && (
              <span className="clock-window">
                <span className="clock-title">{focusedWindow.title || focusedWindow.exe}</span>
              </span>
            )}
          </div>

          <div className="zone zone-end">
            <div className="panel status">
              {session && (
                <div className="player">
                  <button className="icon-btn" {...tip('Previous track')} onClick={() => call('previous track', () => media.previous({ sessionId: session.sessionId }))}>
                    <Glyph name="nf-md-skip_previous" />
                  </button>
                  <button className="icon-btn" {...tip(session.isPlaying ? 'Pause' : 'Play')} onClick={() => call('play/pause', () => media.togglePlayPause({ sessionId: session.sessionId }))}>
                    <Glyph name={session.isPlaying ? 'nf-md-pause' : 'nf-md-play'} />
                  </button>
                  <button className="icon-btn" {...tip('Next track')} onClick={() => call('next track', () => media.next({ sessionId: session.sessionId }))}>
                    <Glyph name="nf-md-skip_next" />
                  </button>
                  <span
                    className="player-title"
                    {...tip({
                      title: session.title || 'Unknown track',
                      rows: [session.artist && ['Artist', session.artist], session.albumTitle && ['Album', session.albumTitle]].filter(Boolean),
                    })}
                  >{mediaLabel}</span>
                </div>
              )}

              {trayIcons.length > 0 && (
                <div className="tray divider-after">
                  {/* Own scroller, so that when even a fully truncated music
                      title leaves too little room, the icons scroll sideways
                      while the collapse chevron stays put. */}
                  {trayOpen && (
                    <div className="tray-icons" onWheel={scrollSideways}>
                      {trayIcons.map(icon => {
                        // Styled tooltip plus the hover forwarding tray apps rely on.
                        const t = tip({ title: icon.tooltip || 'Tray icon', rows: [['id', String(icon.id)]], hint: 'Click: app action · Right-click: menu' });
                        return (
                          <img
                            key={icon.id}
                            className="tray-icon"
                            src={icon.iconUrl}
                            aria-label={t['aria-label']}
                            onClick={() => call('tray click', () => output.systray.onLeftClick(icon.id))}
                            onContextMenu={e => { e.preventDefault(); hideTip(); call('tray right-click', () => output.systray.onRightClick(icon.id)); }}
                            onMouseDown={t.onMouseDown}
                            onMouseEnter={e => { t.onMouseEnter(e); quiet(() => output.systray.onHoverEnter(icon.id)); }}
                            onMouseLeave={e => { t.onMouseLeave(e); quiet(() => output.systray.onHoverLeave(icon.id)); }}
                          />
                        );
                      })}
                    </div>
                  )}
                  <button className="icon-btn tray-toggle" {...tip(trayOpen ? 'Hide tray icons' : `Show tray icons (${trayIcons.length})`)} onClick={toggleTray}>
                    <Glyph name={trayOpen ? 'nf-md-chevron_right' : 'nf-md-chevron_left'} />
                  </button>
                </div>
              )}

              {net && (
                <button className="stat stat-net" {...tip(netTip)} onClick={() => openShell(QS.wifi)}>
                  <Glyph name={networkGlyph(net)} />
                  {net.defaultGateway?.ssid}
                  <span className="net-rates">
                    <span>↓{net.traffic?.received?.siValue}{net.traffic?.received?.siUnit}</span>
                    <span>↑{net.traffic?.transmitted?.siValue}{net.traffic?.transmitted?.siUnit}</span>
                  </span>
                </button>
              )}

              {mem && (
                <div
                  className="stat readonly"
                  {...tip({ title: 'Memory', rows: [['RAM', `${formatGb(mem.usedMemory)} / ${formatGb(mem.totalMemory)}`], ['Swap', `${formatGb(mem.usedSwap)} / ${formatGb(mem.totalSwap)}`]] })}
                >
                  <Glyph name="nf-fae-chip" />
                  <span className={mem.usage > BUSY_PERCENT ? 'is-high' : undefined}>{Math.round(mem.usage)}%</span>
                </div>
              )}

              {cpu && (
                <div
                  className="stat readonly"
                  {...tip({ title: 'CPU', rows: [['Usage', `${Math.round(cpu.usage)}%`], ['Cores', String(cpu.physicalCoreCount)], ['Threads', String(cpu.logicalCoreCount)]] })}
                >
                  <Glyph name="nf-oct-cpu" />
                  <span className={cpu.usage > BUSY_PERCENT ? 'is-high' : undefined}>{Math.round(cpu.usage)}%</span>
                </div>
              )}

              {battery && (
                <button
                  className="stat"
                  {...tip({
                    title: 'Battery',
                    rows: [
                      ['Charge', `${Math.round(battery.chargePercent)}%`],
                      ['State', battery.state],
                      ['Energy saver', energySaver ? 'on' : 'off'],
                      battery.healthPercent != null && ['Health', `${Math.round(battery.healthPercent)}%`],
                    ].filter(Boolean),
                    hint: 'Click: Quick Settings (energy saver, brightness)',
                  })}
                  onClick={() => openShell(QS.main)}
                >
                  {/* While plugged in, a lightning bolt strikes vertically
                      through the battery glyph. */}
                  <span className="battery-glyph" data-tone={batteryTone(battery.chargePercent, battery.isCharging, energySaver)}>
                    <Glyph name={batteryGlyph(battery.chargePercent)} />
                    {battery.isCharging && <Glyph name="nf-md-lightning_bolt" className="battery-bolt" />}
                  </span>
                  {Math.round(battery.chargePercent)}%
                </button>
              )}

              {audio && playback && (
                <button
                  className="stat"
                  {...tip({
                    title: 'Volume',
                    rows: [['Device', playback.name], ['Level', playback.isMuted ? `${Math.round(playback.volume)}% (muted)` : `${Math.round(playback.volume)}%`]],
                    hint: 'Click: mute · Scroll: volume · Right-click: output & mixer',
                  })}
                  onClick={() => call('mute', () => audio.setMute(!playback.isMuted, { deviceId: playback.deviceId }))}
                  onWheel={e => changeVolume(e.deltaY < 0 ? -5 : 5)}
                  onContextMenu={e => { e.preventDefault(); openShell(QS.volume); }}
                >
                  <Glyph name={volumeGlyph(playback)} />
                  <span className={playback.isMuted ? 'is-muted' : undefined}>{Math.round(playback.volume)}%</span>
                </button>
              )}

              {weather && (
                <div
                  className="stat readonly"
                  {...tip({
                    title: 'Weather',
                    rows: [
                      ['Now', weather.status.replaceAll('_', ' ')],
                      ['Temp', `${Math.round(weather.celsiusTemp)}°C / ${Math.round(weather.fahrenheitTemp)}°F`],
                      ['Wind', `${Math.round(weather.windSpeed)} km/h`],
                    ],
                  })}
                >
                  {weatherGlyph(weather.status) && <Glyph name={weatherGlyph(weather.status)} />}
                  {Math.round(weather.celsiusTemp)}°C
                </div>
              )}

              <div className="quick-actions divider-before">
                <button className="icon-btn" {...tip('Bluetooth')} onClick={() => openShell(QS.bluetooth)}>
                  <Glyph name="nf-md-bluetooth" />
                </button>
                <button className="icon-btn" {...tip({ title: 'Cast', hint: 'To a wireless display' })} onClick={() => openShell(QS.cast)}>
                  <Glyph name="nf-md-cast" />
                </button>
                <button className="icon-btn" {...tip({ title: 'Project', hint: 'Duplicate or extend displays' })} onClick={() => openShell(QS.project)}>
                  <Glyph name="nf-md-monitor_multiple" />
                </button>
                <button className="icon-btn" {...tip({ title: 'Quick Settings', hint: 'Airplane mode, night light, hotspot, nearby sharing, accessibility, brightness' })} onClick={() => openShell(QS.main)}>
                  <Glyph name="nf-md-tune_vertical" />
                </button>
                <button className="icon-btn" {...tip('Notifications & calendar')} onClick={() => openShell(QS.notifications)}>
                  <Glyph name="nf-md-bell_outline" />
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }
  </script>
</body>

</html>
